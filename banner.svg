<svg width="950" height="280" viewBox="0 0 950 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- BACKGROUND GRADIENT -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C1E" />
      <stop offset="50%" stop-color="#0A1836" />
      <stop offset="100%" stop-color="#030814" />
    </linearGradient>

    <!-- ULTRA BRIGHT TEXT GRADIENT -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#00F0FF" />
      <stop offset="70%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- BORDER GRADIENT -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- HIGH CONTRAST DROP SHADOW -->
    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00F0FF" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#0077FF" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @keyframes titlePulse {
      0% { filter: drop-shadow(0 0 8px #00F0FF) drop-shadow(0 0 20px #0055FF); transform: translateY(0px); }
      50% { filter: drop-shadow(0 0 20px #00F0FF) drop-shadow(0 0 35px #00E5FF); transform: translateY(-4px); }
      100% { filter: drop-shadow(0 0 8px #00F0FF) drop-shadow(0 0 20px #0055FF); transform: translateY(0px); }
    }
    @keyframes rotateCube {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes scanSweep {
      0% { transform: translateY(-280px); opacity: 0; }
      50% { opacity: 0.5; }
      100% { transform: translateY(280px); opacity: 0; }
    }

    .main-card {
      fill: url(#bg-grad);
      stroke: url(#border-grad);
      stroke-width: 2.5px;
      rx: 18px;
    }
    .title-name {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 68px;
      font-weight: 900;
      fill: url(#title-grad);
      letter-spacing: 8px;
      text-anchor: middle;
      animation: titlePulse 3.5s ease-in-out infinite;
    }
    .sub-title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      font-size: 22px;
      font-weight: 800;
      fill: #FFD700;
      letter-spacing: 14px;
      text-anchor: middle;
      filter: drop-shadow(0 0 8px #FFD700);
    }
    .vector-cube {
      transform-origin: 820px 140px;
      animation: rotateCube 14s linear infinite;
    }
    .scan-beam {
      animation: scanSweep 4.5s linear infinite;
    }
  </style>

  <!-- CARD BACKGROUND -->
  <rect width="950" height="280" class="main-card" />

  <!-- GRID PATTERN -->
  <g opacity="0.12" stroke="#00F0FF" stroke-width="1">
    <line x1="0" y1="70" x2="950" y2="70" />
    <line x1="0" y1="140" x2="950" y2="140" />
    <line x1="0" y1="210" x2="950" y2="210" />
    <line x1="200" y1="0" x2="200" y2="280" />
    <line x1="400" y1="0" x2="400" y2="280" />
    <line x1="600" y1="0" x2="600" y2="280" />
    <line x1="800" y1="0" x2="800" y2="280" />
  </g>

  <!-- SCANLINE BEAM -->
  <rect x="0" y="0" width="950" height="4" fill="#00F0FF" class="scan-beam" filter="url(#text-glow)" />

  <!-- RETICLES -->
  <g stroke="#00F0FF" stroke-width="3" opacity="0.9">
    <path d="M 30 30 L 30 70 M 30 30 L 70 30" />
    <path d="M 920 30 L 920 70 M 920 30 L 880 30" />
    <path d="M 30 250 L 30 210 M 30 250 L 70 250" />
    <path d="M 920 250 L 920 210 M 920 250 L 880 250" />
  </g>

  <!-- 3D ROTATING VECTOR CUBE ON RIGHT -->
  <g class="vector-cube">
    <polygon points="820,80 860,105 860,155 820,180 780,155 780,105" fill="#00F0FF" fill-opacity="0.08" stroke="#00F0FF" stroke-width="2" />
    <polygon points="820,80 860,105 820,130 780,105" fill="#00F0FF" fill-opacity="0.15" stroke="#3B82F6" stroke-width="1.5" />
    <polygon points="780,105 820,130 820,180 780,155" fill="#3B82F6" fill-opacity="0.2" stroke="#00F0FF" stroke-width="1.5" />
    <polygon points="820,130 860,105 860,155 820,180" fill="#00E5FF" fill-opacity="0.2" stroke="#FFD700" stroke-width="1.5" />
    <circle cx="820" cy="130" r="6" fill="#FFD700" filter="url(#text-glow)" />
  </g>

  <!-- TEXT BACKPLATE FOR 100% CONTRAST & LEGIBILITY -->
  <rect x="180" y="55" width="540" height="170" rx="14" fill="#030814" fill-opacity="0.75" stroke="#00F0FF" stroke-width="1" />

  <!-- HIGH-VISIBILITY TITLE & SUBTITLE -->
  <g transform="translate(450, 132)">
    <text x="0" y="0" class="title-name">A GOURAV</text>
    <text x="0" y="52" class="sub-title">✦ PORTFOLIO ✦</text>
  </g>
</svg>
