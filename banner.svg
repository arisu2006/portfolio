<svg width="950" height="240" viewBox="0 0 950 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- MATURE DARK BACKDROP -->
    <linearGradient id="dark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- SOFT ELEGANT AURORA GLOW -->
    <radialGradient id="soft-aurora" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="text-white" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="border-subtle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="12" flood-color="#00F0FF" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    @keyframes subtleFloat {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
      100% { transform: translateY(0px); }
    }
    @keyframes slowRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .bg-frame {
      fill: url(#dark-bg);
      stroke: url(#border-subtle);
      stroke-width: 1.5px;
      rx: 16px;
    }
    .hero-name {
      font-family: 'Cormorant Garamond', 'Space Grotesk', system-ui, -apple-system, sans-serif;
      font-size: 64px;
      font-weight: 700;
      fill: url(#text-white);
      letter-spacing: 6px;
      text-anchor: middle;
      filter: url(#soft-glow);
      animation: subtleFloat 5s ease-in-out infinite;
    }
    .hero-tag {
      font-family: 'Space Grotesk', 'JetBrains Mono', system-ui, sans-serif;
      font-size: 15px;
      font-weight: 600;
      fill: #38BDF8;
      letter-spacing: 12px;
      text-anchor: middle;
      opacity: 0.9;
    }
    .accent-wire {
      transform-origin: 820px 120px;
      animation: slowRotate 24s linear infinite;
    }
  </style>

  <!-- BASE CARD -->
  <rect width="950" height="240" class="bg-frame" />

  <!-- SOFT BACKGROUND AURORA -->
  <rect width="950" height="240" fill="url(#soft-aurora)" rx="16" />

  <!-- CORNER RETICLES -->
  <g stroke="#38BDF8" stroke-width="1.5" opacity="0.4">
    <path d="M 30 30 L 30 55 M 30 30 L 55 30" />
    <path d="M 920 30 L 920 55 M 920 30 L 895 30" />
    <path d="M 30 210 L 30 185 M 30 210 L 55 210" />
    <path d="M 920 210 L 920 185 M 920 210 L 895 210" />
  </g>

  <!-- SOPHISTICATED 3D VECTOR GEOMETRY -->
  <g class="accent-wire" stroke="#38BDF8" stroke-width="1" fill="none" opacity="0.45">
    <circle cx="820" cy="120" r="45" stroke-dasharray="4 4" />
    <polygon points="820,80 855,100 855,140 820,160 785,140 785,100" />
    <line x1="820" y1="80" x2="820" y2="160" />
    <line x1="785" y1="100" x2="855" y2="140" />
    <line x1="855" y1="100" x2="785" y2="140" />
    <circle cx="820" cy="120" r="3" fill="#00F0FF" />
  </g>

  <!-- CLEAN FLOATING TYPOGRAPHY -->
  <g transform="translate(440, 118)">
    <text x="0" y="0" class="hero-name">A GOURAV</text>
    <text x="0" y="44" class="hero-tag">PORTFOLIO</text>
  </g>
</svg>
