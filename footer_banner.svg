<svg width="950" height="180" viewBox="0 0 950 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050C1E" />
      <stop offset="50%" stop-color="#0A1836" />
      <stop offset="100%" stop-color="#030814" />
    </linearGradient>

    <linearGradient id="quote-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FFD700" />
      <stop offset="70%" stop-color="#FFB700" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <filter id="quote-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#FFD700" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#00F0FF" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    @keyframes quotePulse {
      0% { filter: drop-shadow(0 0 6px #FFD700) drop-shadow(0 0 15px #00F0FF); transform: translateY(0px); }
      50% { filter: drop-shadow(0 0 18px #FFD700) drop-shadow(0 0 30px #00F0FF); transform: translateY(-3px); }
      100% { filter: drop-shadow(0 0 6px #FFD700) drop-shadow(0 0 15px #00F0FF); transform: translateY(0px); }
    }
    @keyframes waveFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 600; }
    }

    .footer-card {
      fill: url(#footer-bg);
      stroke: #00F0FF;
      stroke-width: 2px;
      rx: 16px;
    }
    .quote-title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 36px;
      font-weight: 900;
      fill: url(#quote-gold);
      letter-spacing: 5px;
      text-anchor: middle;
      animation: quotePulse 3.5s ease-in-out infinite;
    }
    .quote-sub {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      font-size: 15px;
      font-weight: 800;
      fill: #00F0FF;
      letter-spacing: 6px;
      text-anchor: middle;
      filter: drop-shadow(0 0 6px #00F0FF);
    }
    .wave-line {
      stroke-dasharray: 20 10;
      animation: waveFlow 12s linear infinite;
    }
  </style>

  <!-- CARD BASE -->
  <rect width="950" height="180" class="footer-card" />

  <!-- DYNAMIC WAVE LINES AT BOTTOM -->
  <path d="M 0 145 Q 237.5 125 475 145 T 950 145" fill="none" stroke="#00F0FF" stroke-width="2" opacity="0.4" class="wave-line" />
  <path d="M 0 160 Q 237.5 140 475 160 T 950 160" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.4" class="wave-line" />

  <!-- RETICLES -->
  <g stroke="#00F0FF" stroke-width="2.5" opacity="0.85">
    <path d="M 25 25 L 25 50 M 25 25 L 50 25" />
    <path d="M 925 25 L 925 50 M 925 25 L 900 25" />
    <path d="M 25 155 L 25 130 M 25 155 L 50 155" />
    <path d="M 925 155 L 925 130 M 925 155 L 900 155" />
  </g>

  <!-- TEXT BACKPLATE FOR 100% CONTRAST -->
  <rect x="200" y="30" width="550" height="120" rx="12" fill="#030814" fill-opacity="0.8" stroke="#FFD700" stroke-width="1" />

  <!-- HIGH VISIBILITY QUOTE & AUTHOR -->
  <g transform="translate(475, 84)">
    <text x="0" y="0" class="quote-title">"Stay GOATED 🐐"</text>
    <text x="0" y="40" class="quote-sub">— A GOURAV • DEPLOYED LIVE ON VERCEL ⚡</text>
  </g>
</svg>
