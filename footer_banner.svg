<svg width="950" height="180" viewBox="0 0 950 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050914" />
      <stop offset="50%" stop-color="#0c162d" />
      <stop offset="100%" stop-color="#050914" />
    </linearGradient>

    <linearGradient id="quote-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>

    <filter id="footer-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseQuote {
      0% { filter: drop-shadow(0 0 8px #00F0FF) drop-shadow(0 0 20px #A855F7); transform: scale(0.995); }
      50% { filter: drop-shadow(0 0 22px #00F0FF) drop-shadow(0 0 40px #00F0FF); transform: scale(1.005); }
      100% { filter: drop-shadow(0 0 8px #00F0FF) drop-shadow(0 0 20px #A855F7); transform: scale(0.995); }
    }
    @keyframes waveMotion {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 600; }
    }
    .footer-rect {
      fill: url(#footer-bg);
      stroke: #00F0FF;
      stroke-width: 1.5px;
      rx: 16px;
    }
    .quote-text {
      font-family: 'Space Grotesk', 'Syne', sans-serif;
      font-size: 32px;
      font-weight: 800;
      fill: url(#quote-grad);
      letter-spacing: 4px;
      text-anchor: middle;
      animation: pulseQuote 3s infinite ease-in-out;
    }
    .sub-quote {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      fill: #A855F7;
      letter-spacing: 6px;
      text-anchor: middle;
    }
    .animated-wave {
      stroke-dasharray: 20 10;
      animation: waveMotion 15s linear infinite;
    }
  </style>

  <!-- CARD BASE -->
  <rect width="950" height="180" class="footer-rect" />

  <!-- DYNAMIC WAVE LINES AT BOTTOM -->
  <path d="M 0 140 Q 237.5 120 475 140 T 950 140" fill="none" stroke="#00F0FF" stroke-width="1.5" opacity="0.35" class="animated-wave" />
  <path d="M 0 155 Q 237.5 135 475 155 T 950 155" fill="none" stroke="#A855F7" stroke-width="1.5" opacity="0.35" class="animated-wave" />

  <!-- RETICLES -->
  <g stroke="#00F0FF" stroke-width="2" opacity="0.7">
    <path d="M 25 25 L 25 50 M 25 25 L 50 25" />
    <path d="M 925 25 L 925 50 M 925 25 L 900 25" />
    <path d="M 25 155 L 25 130 M 25 155 L 50 155" />
    <path d="M 925 155 L 925 130 M 925 155 L 900 155" />
  </g>

  <!-- MAIN QUOTE & AUTHOR -->
  <g transform="translate(475, 80)">
    <text x="0" y="0" class="quote-text">"Stay GOATED 🐐"</text>
    <text x="0" y="38" class="sub-quote">— A GOURAV • DEPLOYED LIVE ON VERCEL ⚡</text>
  </g>
</svg>
