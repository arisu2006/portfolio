<svg width="950" height="160" viewBox="0 0 950 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="border-subtle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#00F0FF" flood-opacity="0.2"/>
    </filter>
  </defs>

  <style>
    @keyframes textFloat {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-2px); }
      100% { transform: translateY(0px); }
    }
    .footer-frame {
      fill: url(#footer-bg);
      stroke: url(#border-subtle);
      stroke-width: 1.5px;
      rx: 16px;
    }
    .quote-title {
      font-family: 'Cormorant Garamond', 'Space Grotesk', system-ui, sans-serif;
      font-size: 34px;
      font-weight: 700;
      fill: #FFFFFF;
      letter-spacing: 4px;
      text-anchor: middle;
      filter: url(#soft-glow);
      animation: textFloat 4s ease-in-out infinite;
    }
    .quote-sub {
      font-family: 'Space Grotesk', 'JetBrains Mono', system-ui, monospace;
      font-size: 13px;
      font-weight: 600;
      fill: #38BDF8;
      letter-spacing: 6px;
      text-anchor: middle;
      opacity: 0.85;
    }
  </style>

  <!-- BASE CARD -->
  <rect width="950" height="160" class="footer-frame" />

  <!-- CORNER RETICLES -->
  <g stroke="#38BDF8" stroke-width="1.5" opacity="0.4">
    <path d="M 25 25 L 25 45 M 25 25 L 45 25" />
    <path d="M 925 25 L 925 45 M 925 25 L 905 25" />
    <path d="M 25 135 L 25 115 M 25 135 L 45 135" />
    <path d="M 925 135 L 925 115 M 925 135 L 905 135" />
  </g>

  <!-- SOPHISTICATED FLOATING TEXT -->
  <g transform="translate(475, 76)">
    <text x="0" y="0" class="quote-title">"Stay GOATED 🐐"</text>
    <text x="0" y="36" class="quote-sub">— A GOURAV • PORTFOLIO —</text>
  </g>
</svg>
